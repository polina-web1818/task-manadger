<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>
<body>
    <div class="container">
        <h1>Менеджер задач</h1>
        <form id="form-add-task">
            <legend>Создание задач</legend> 
            <!-- название формы  -->
            <label for="name">Введите задачу</label><br>
            <input type="text" id="name" required><br>
            
            <input type="checkbox" id="immediate">
            <label for="immediate">Срочная задача</label><br>

            <input type="submit" value="Создать задачу">
        </form>
        <div class="filters">
            <button id="lowCase">Все строчные</button>
            <button id="btn1">Сортировка по алфавиту</button>
            <button id="btn2">Сортировка против алфавитного порядка</button>
        </div>
        <div class="tasks">

        </div>
    </div>
</body>
</html>
